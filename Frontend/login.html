<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Clothing Store</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      background: linear-gradient(135deg, #ffe6f0 0%, #fff0f6 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Poppins', sans-serif;
    }
    .login-card {
      background: white;
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(255,77,166,0.15);
      padding: 40px 36px;
      width: 100%;
      max-width: 420px;
    }
    .brand-logo {
      text-align: center;
      margin-bottom: 28px;
    }
    .brand-logo img {
      height: 50px;
    }
    .login-card h2 {
      text-align: center;
      color: #d63384;
      font-weight: 700;
      font-size: 24px;
      margin-bottom: 6px;
    }
    .login-card .subtitle {
      text-align: center;
      color: #aaa;
      font-size: 13px;
      margin-bottom: 28px;
    }
    .form-label {
      font-size: 13px;
      font-weight: 600;
      color: #555;
    }
    .form-control {
      border-radius: 10px;
      border: 1.5px solid #e0e0e0;
      padding: 11px 14px;
      font-size: 14px;
      font-family: 'Poppins', sans-serif;
      transition: 0.2s;
    }
    .form-control:focus {
      border-color: #ff4da6;
      box-shadow: 0 0 0 3px rgba(255,77,166,0.15);
    }
    .login-btn {
      width: 100%;
      background: linear-gradient(135deg, #ff4da6, #d63384);
      color: white;
      border: none;
      padding: 13px;
      border-radius: 30px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
      box-shadow: 0 4px 15px rgba(255,77,166,0.3);
      font-family: 'Poppins', sans-serif;
      margin-top: 8px;
    }
    .login-btn:hover {
      background: linear-gradient(135deg, #d63384, #b30059);
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(255,77,166,0.4);
    }
    .login-btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }
    .msg-box {
      padding: 11px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 16px;
      display: none;
    }
    .msg-box.error   { background: #fff0f0; border: 1px solid #dc3545; color: #dc3545; }
    .msg-box.success { background: #f0fff4; border: 1px solid #28a745; color: #28a745; }
    .form-footer {
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
      color: #888;
    }
    .form-footer a {
      color: #d63384;
      font-weight: 600;
      text-decoration: none;
    }
    .form-footer a:hover { text-decoration: underline; }
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 20px 0;
      color: #ccc;
      font-size: 12px;
    }
    .divider::before, .divider::after {
      content: "";
      flex: 1;
      border-top: 1px solid #eee;
    }
  </style>
</head>
<body>

<div class="login-card">

  <!-- Brand -->
  <div class="brand-logo">
    <img src="images/logo.img.png" alt="ClothingStore"
         onerror="this.style.display='none'">
    <div style="color:#ff4da6;font-size:22px;font-weight:800;margin-top:4px;">ClothingStore</div>
  </div>

  <h2>Welcome Back 👋</h2>
  <p class="subtitle">Login to your account to continue</p>

  <!-- Message box -->
  <div class="msg-box" id="msg-box"></div>

  <!-- Email -->
  <div class="mb-3">
    <label class="form-label">Email Address</label>
    <input type="email" class="form-control" id="login-email"
           placeholder="Enter your email" autocomplete="email">
  </div>

  <!-- Password -->
  <div class="mb-3">
    <label class="form-label">Password</label>
    <input type="password" class="form-control" id="login-password"
           placeholder="Enter your password" autocomplete="current-password">
  </div>

  <!-- Login Button -->
  <button class="login-btn" id="login-btn" onclick="doLogin()">
    Login →
  </button>

  <div class="divider">or</div>

  <div class="form-footer">
    Don't have an account? <a href="signup.html">Sign Up</a>
  </div>
  <div class="form-footer" style="margin-top:10px;">
    <a href="homepage.html" style="color:#aaa;font-weight:400;">← Back to Store</a>
  </div>

</div>

<script>
  // Allow Enter key to submit
  document.addEventListener("keydown", function(e) {
    if (e.key === "Enter") doLogin();
  });

  function showMsg(text, type) {
    const el = document.getElementById("msg-box");
    el.textContent = text;
    el.className = "msg-box " + type;
    el.style.display = "block";
  }

  async function doLogin() {
    const btn      = document.getElementById("login-btn");
    const email    = document.getElementById("login-email").value.trim();
    const password = document.getElementById("login-password").value;

    // Client-side validation
    if (!email)    { showMsg("⚠️ Please enter your email.", "error"); return; }
    if (!password) { showMsg("⚠️ Please enter your password.", "error"); return; }

    btn.disabled    = true;
    btn.textContent = "Logging in...";

    try {
      const res = await fetch("/api/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password })
      });

      const data = await res.json();

      if (res.ok) {
        localStorage.setItem("token", data.token);
        localStorage.setItem("user", JSON.stringify(data.user));
        showMsg("✅ Login successful! Redirecting...", "success");
        setTimeout(() => { window.location.href = "/homepage.html"; }, 1200);
      } else {
        showMsg("⚠️ " + (data.message || "Invalid email or password."), "error");
        btn.disabled    = false;
        btn.textContent = "Login →";
      }
    } catch (err) {
      showMsg("⚠️ Cannot connect to server. Make sure backend is running (npm run dev).", "error");
      btn.disabled    = false;
      btn.textContent = "Login →";
    }
  }
</script>

</body>
</html>
