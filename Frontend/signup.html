<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Clothing Store</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      background: linear-gradient(135deg, #ffe6f0 0%, #fff0f6 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Poppins', sans-serif;
      padding: 20px 0;
    }
    .signup-card {
      background: white;
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(255,77,166,0.15);
      padding: 40px 36px;
      width: 100%;
      max-width: 440px;
    }
    .brand-logo {
      text-align: center;
      margin-bottom: 24px;
    }
    .brand-logo img { height: 50px; }
    .signup-card h2 {
      text-align: center;
      color: #d63384;
      font-weight: 700;
      font-size: 24px;
      margin-bottom: 6px;
    }
    .signup-card .subtitle {
      text-align: center;
      color: #aaa;
      font-size: 13px;
      margin-bottom: 24px;
    }
    .form-label {
      font-size: 13px;
      font-weight: 600;
      color: #555;
    }
    .form-control {
      border-radius: 10px;
      border: 1.5px solid #e0e0e0;
      padding: 11px 14px;
      font-size: 14px;
      font-family: 'Poppins', sans-serif;
      transition: 0.2s;
    }
    .form-control:focus {
      border-color: #ff4da6;
      box-shadow: 0 0 0 3px rgba(255,77,166,0.15);
    }
    .signup-btn {
      width: 100%;
      background: linear-gradient(135deg, #ff4da6, #d63384);
      color: white;
      border: none;
      padding: 13px;
      border-radius: 30px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
      box-shadow: 0 4px 15px rgba(255,77,166,0.3);
      font-family: 'Poppins', sans-serif;
      margin-top: 8px;
    }
    .signup-btn:hover {
      background: linear-gradient(135deg, #d63384, #b30059);
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(255,77,166,0.4);
    }
    .signup-btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }
    .msg-box {
      padding: 11px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 16px;
      display: none;
    }
    .msg-box.error   { background: #fff0f0; border: 1px solid #dc3545; color: #dc3545; }
    .msg-box.success { background: #f0fff4; border: 1px solid #28a745; color: #28a745; }
    .form-footer {
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
      color: #888;
    }
    .form-footer a {
      color: #d63384;
      font-weight: 600;
      text-decoration: none;
    }
    .form-footer a:hover { text-decoration: underline; }
    .optional-tag {
      font-size: 11px;
      color: #bbb;
      font-weight: 400;
      margin-left: 4px;
    }
    .password-hint {
      font-size: 11px;
      color: #bbb;
      margin-top: 4px;
    }
  </style>
</head>
<body>

<div class="signup-card">

  <!-- Brand -->
  <div class="brand-logo">
    <img src="images/logo.img.png" alt="ClothingStore"
         onerror="this.style.display='none'">
    <div style="color:#ff4da6;font-size:22px;font-weight:800;margin-top:4px;">ClothingStore</div>
  </div>

  <h2>Create Account ✨</h2>
  <p class="subtitle">Join us and start shopping!</p>

  <!-- Message box -->
  <div class="msg-box" id="msg-box"></div>

  <!-- Full Name -->
  <div class="mb-3">
    <label class="form-label">Full Name</label>
    <input type="text" class="form-control" id="signup-name"
           placeholder="Enter your full name" autocomplete="name">
  </div>

  <!-- Email -->
  <div class="mb-3">
    <label class="form-label">Email Address</label>
    <input type="email" class="form-control" id="signup-email"
           placeholder="Enter your email" autocomplete="email">
  </div>

  <!-- Phone (optional) -->
  <div class="mb-3">
    <label class="form-label">Phone Number <span class="optional-tag">(optional)</span></label>
    <input type="text" class="form-control" id="signup-phone"
           placeholder="+91 XXXXXXXXXX" autocomplete="tel">
  </div>

  <!-- Password -->
  <div class="mb-3">
    <label class="form-label">Password</label>
    <input type="password" class="form-control" id="signup-password"
           placeholder="Create a password" autocomplete="new-password">
    <div class="password-hint">Minimum 6 characters</div>
  </div>

  <!-- Signup Button -->
  <button class="signup-btn" id="signup-btn" onclick="doSignup()">
    Create Account →
  </button>

  <div class="form-footer" style="margin-top:20px;">
    Already have an account? <a href="login.html">Login</a>
  </div>
  <div class="form-footer" style="margin-top:10px;">
    <a href="homepage.html" style="color:#aaa;font-weight:400;">← Back to Store</a>
  </div>

</div>

<script>
  // Allow Enter key to submit
  document.addEventListener("keydown", function(e) {
    if (e.key === "Enter") doSignup();
  });

  function showMsg(text, type) {
    const el = document.getElementById("msg-box");
    el.textContent = text;
    el.className = "msg-box " + type;
    el.style.display = "block";
  }

  async function doSignup() {
    const btn      = document.getElementById("signup-btn");
    const name     = document.getElementById("signup-name").value.trim();
    const email    = document.getElementById("signup-email").value.trim();
    const phone    = document.getElementById("signup-phone").value.trim();
    const password = document.getElementById("signup-password").value;

    // Client-side validation
    if (!name)               { showMsg("⚠️ Please enter your full name.", "error"); return; }
    if (!email)              { showMsg("⚠️ Please enter your email.", "error"); return; }
    if (!password)           { showMsg("⚠️ Please create a password.", "error"); return; }
    if (password.length < 6) { showMsg("⚠️ Password must be at least 6 characters.", "error"); return; }

    btn.disabled    = true;
    btn.textContent = "Creating Account...";

    try {
      const res = await fetch("/api/auth/signup", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, email, phone, password })
      });

      const data = await res.json();

      if (res.ok) {
        localStorage.setItem("token", data.token);
        localStorage.setItem("user", JSON.stringify(data.user));
        showMsg("✅ Account created! Redirecting...", "success");
        setTimeout(() => { window.location.href = "/homepage.html"; }, 1200);
      } else {
        showMsg("⚠️ " + (data.message || "Signup failed. Please try again."), "error");
        btn.disabled    = false;
        btn.textContent = "Create Account →";
      }
    } catch (err) {
      showMsg("⚠️ Cannot connect to server. Make sure backend is running (npm run dev).", "error");
      btn.disabled    = false;
      btn.textContent = "Create Account →";
    }
  }
</script>

</body>
</html>
